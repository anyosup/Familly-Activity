# 매일 아침 6시(한국시간)에 국립공원 데이터를 다시 모으고 웹페이지를 새로 만든다.
# GitHub 저장소의 Actions 탭에서 "Run workflow" 버튼으로 바로 실행할 수도 있다.
name: 데이터 갱신

on:
  schedule:
    - cron: "0 21 * * *"   # UTC 21시 = 한국 06시
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 국립공원 데이터 수집
        run: python collector/collect_knps.py

      - name: 웹페이지 만들기
        run: python site/build_site.py

      - name: 바뀐 내용 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "데이터 갱신 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')"
          git push
